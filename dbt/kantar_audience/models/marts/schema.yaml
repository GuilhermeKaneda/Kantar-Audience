version: 2

models:
  - name: mart_audience_share
    description: "Share calculado por emissora, praça, data e faixa horária, comparado ao total ligados."
    config:
      materialized: incremental
      unique_key:
        - broadcaster
        - market
        - date
        - time_slot
        - target
    columns:
      - name: broadcaster
        tests:
          - not_null
      - name: market
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: week_day
        tests:
          - not_null
          - accepted_values:
              values: ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo']
      - name: week_day_number
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
      - name: time_slot
        tests:
          - not_null
      - name: target
        tests:
          - not_null
      - name: target_group
        tests:
          - accepted_values:
              values: ['Gênero', 'Faixa Etária', 'Classe Social', 'Geral']
      - name: broadcaster_rating
        tests:
          - not_null
      - name: total_rating
        tests:
          - not_null
      - name: share
        tests:
          - not_null